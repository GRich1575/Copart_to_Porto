# Automated checks for PRs. Status check `checks` is required before merge into main.
# Local run: python tools/check_repo.py && python -m pytest -q
name: checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by full commit SHA (tags can move, SHAs cannot).
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Repository rule checks
        run: python tools/check_repo.py
      - name: Tests
        run: python -m pytest -q
